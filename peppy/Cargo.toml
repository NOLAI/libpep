[package]
name = "peppy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/NOLAI/libpep"
repository.workspace = true
license.workspace = true
keywords = ["crypto", "pep", "pseudonymization", "elgamal", "privacy"]
categories = ["cryptography", "command-line-utilities"]
description = "Command line interface to libpep, polymorphic encryption and pseudonymization"
readme = "README.md"

[lints]
workspace = true

[features]
default = ["json"]
json = ["libpep/json"] # The `json` commands
elgamal3 = ["libpep/elgamal3"] # Build against libpep's ElGamal triple encryption
insecure = ["libpep/insecure"] # Commands that typically should not be used in production

[dependencies]
libpep = { workspace = true, features = ["long", "offline", "serde", "verifiable"] }
clap = { version = "^4.6", features = ["derive", "wrap_help"] }
clap_complete = "^4.6"
clap_mangen = "^0.3"
rand = "^0.10"
rand_core = "^0.10"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
sha2 = "^0.11.0"

[package.metadata.deb]
depends = ""
assets = [
    ["peppy.1", "usr/man/man1/", "444"],
    ["target/release/peppy", "usr/bin/peppy", "555"],
]

[package.metadata.freebsd]
assets = [
    ["peppy.1", "man/man1/", "444"],
    ["target/release/peppy", "bin/peppy", "555"],
]
