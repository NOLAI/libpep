[package]
name = "libpep-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for libpep, polymorphic encryption and pseudonymization"
publish = false

[lib]
name = "libpep_py"
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["long", "offline", "batch", "serde", "json"]
serde = ["libpep/serde"]
long = ["libpep/long"]
offline = ["libpep/offline"]
batch = ["libpep/batch"]
json = ["libpep/json", "long", "serde"]
elgamal3 = ["libpep/elgamal3"]
global-pseudonyms = ["libpep/global-pseudonyms", "offline"]
legacy = ["libpep/legacy", "elgamal3", "offline", "global-pseudonyms"]
insecure = ["libpep/insecure"]
extension-module = ["pyo3/extension-module"]

[dependencies]
libpep = { workspace = true }
pyo3 = { version = "0.29" }
derive_more = { version = "^2.1", features = ["from", "into", "deref"] }
rand = "^0.10"
serde_json = "^1.0"
