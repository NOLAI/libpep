[workspace]
members = [".", "bindings/python", "bindings/wasm"]
resolver = "2"

[workspace.package]
version = "0.14.0"
edition = "2021"
rust-version = "1.88"
authors = ["Bernard van Gastel <bvgastel@bitpowder.com>", "Job Doesburg <job@jobdoesburg.nl>"]
license = "Apache-2.0"
repository = "https://github.com/NOLAI/libpep"

[workspace.dependencies]
libpep = { version = "0.14.0", path = ".", default-features = false }

[package]
name = "libpep"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/NOLAI/libpep"
repository.workspace = true
documentation = "https://docs.rs/libpep"
license.workspace = true
keywords = ["crypto", "pep", "pseudonymization", "elgamal", "privacy"]
categories = ["cryptography", "algorithms", "command-line-utilities"]
description = "Library for polymorphic encryption and pseudonymization"
readme = "README.md"
exclude = ["bindings", "pkg", "pkg-web", "node_modules", ".github"]

[features]
default = ["long", "offline", "batch", "batch-pk", "serde", "json", "verifiable"]
serde = ["dep:serde"] # For (de)serialization support via Serde
verifiable = [] # Enable verifiable operations with zero-knowledge proofs
verifiable-derivation = ["verifiable"] # Carter-Wegman factor derivation with publicly computable commitments; not the preferred scheme, see the README
elgamal3 = [] # For ElGamal triple encryption, including the recipient's public key in message encoding
offline = [] # For encryption towards global keys (instead of encryption with session keys)
batch = [] # For batch transcryption with reordering to prevent linkability
batch-pk = ["batch"] # Carry the recipient public key inside EncryptedBatch (elgamal2 only); enables convenience batch ops that don't require a caller-supplied pk. No effect under elgamal3.
long = [] # For long pseudonyms and attributes over 15 bytes
json = ["long", "serde", "dep:serde_json"] # For JSON encryption/decryption support
global-pseudonyms = ["offline"] # Allow pseudonyms in a global domain (uses global pseudonyms with reshuffle factor 1), which is potentially insecure
legacy = ["elgamal3", "offline", "global-pseudonyms", "dep:hmac"] # For compatibility with the legacy PEP repository implementation
insecure = [] # Enable insecure methods that typically should not be used in production (does not include "global-pseudonyms", which is a separate feature)
cli = ["dep:clap", "dep:clap_complete", "dep:clap_mangen", "dep:serde_json", "dep:rand", "long", "offline", "serde", "verifiable"] # The peppy command line tool: cargo install libpep --features cli

[lints]
workspace = true

[lib]
name = "libpep"
crate-type = ["rlib"]
path = "src/lib/lib.rs"

[[bin]]
name = "peppy"
required-features = ["cli"]

[dependencies]
curve25519-dalek = { version = "=5.0.0", features = ["rand_core", "lizard", "zeroize"] }
rand_core = "^0.10"
rand = { version = "^0.10", optional = true }
sha2 = "^0.11.0"
hmac = { version = "^0.13.0", optional = true }
derive_more = { version = "^2.0", features = ["deref", "from", "into"] }
hex = "^0.4"
base64 = "^0.23.0"
serde = { version = "^1.0", features = ["derive"], optional = true }
serde_json = { version = "^1.0", optional = true }
thiserror = "^2.0"
zeroize = "^1.8"
clap = { version = "^4.6", features = ["derive", "wrap_help"], optional = true }
clap_complete = { version = "^4.6", optional = true }
clap_mangen = { version = "^0.3", optional = true }

[dev-dependencies]
serde_json = "^1.0"
# `chacha` for a reproducible rng in tests: `StdRng` is explicitly not reproducible across
# releases, and `chacha20` is already in the dependency tree via `rand`.
rand = { version = "^0.10", features = ["chacha"] }
criterion = { version = "^0.8", features = ["html_reports"] }
energy-bench = "^0.3.0"

[[bench]]
name = "base"
harness = false

[[bench]]
name = "quick"
harness = false
required-features = ["batch", "json"]

[[bench]]
name = "distributed"
harness = false
required-features = ["batch", "batch-pk"]

[[bench]]
name = "energy_base"
harness = false

[[bench]]
name = "energy_distributed"
harness = false
required-features = ["batch", "batch-pk"]

[[bench]]
name = "verifiable"
harness = false
required-features = ["verifiable"]

[[bench]]
name = "dleq"
harness = false
required-features = ["verifiable"]

[package.metadata.deb]
name = "peppy"
depends = ""
features = ["cli"]
assets = [
    ["peppy.1", "usr/man/man1/", "444"],
    ["target/release/peppy", "usr/bin/peppy", "555"],
]

[package.metadata.freebsd]
assets = [
    ["peppy.1", "man/man1/", "444"],
    ["target/release/peppy", "bin/peppy", "555"],
]

[package.metadata.docs.rs]
# The default ciphertext mode (no elgamal3) with every feature that adds API
features = ["offline", "batch", "batch-pk", "long", "serde", "json", "verifiable", "verifiable-derivation", "insecure", "global-pseudonyms"]
rustdoc-args = ["--cfg", "docsrs"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
