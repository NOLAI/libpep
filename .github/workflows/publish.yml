name: Publish new version

on:
  release:
    types: [created]
  # Builds the packages without publishing, to try the wheel matrix.
  workflow_dispatch:

jobs:
  semver-checks:
    runs-on: ubuntu-latest
    name: cargo semver-checks
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Check the core crate with the default feature set, plus elgamal3 and legacy.
          # The binding crates are not published to crates.io.
          package: libpep
          feature-group: default-features
          features: elgamal3,legacy,insecure

  publish-crate:
    runs-on: ubuntu-latest
    needs: semver-checks
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write

    name: Build and publish Rust crate to crates.io
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p libpep
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: semver-checks
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write

    name: Build and publish WASM package to NPM
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: cargo install wasm-pack
      - run: npm run build
        working-directory: bindings/wasm
      - run: npm publish --provenance --access public
        working-directory: bindings/wasm

  build-pypi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            sdist: --sdist
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    needs: semver-checks
    name: Build Python wheels (${{ matrix.os }}, ${{ matrix.target }})
    steps:
      - uses: actions/checkout@v7
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.sdist }}
          sccache: 'true'
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build-pypi
    if: github.event_name == 'release'
    permissions:
      contents: read
      id-token: write

    name: Publish Python package to PyPI
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
