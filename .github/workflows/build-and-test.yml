name: Build and Test

on:
  push:
    branches:
      - 'main'
  pull_request:

env:
  # Workaround for intermittent `[16] Error in the HTTP2 framing layer` from
  # crates.io's CDN. Forces cargo's curl backend to use HTTP/1.1 instead of
  # HTTP/2 multiplexing when fetching the registry and crate sources.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  semver-checks:
    runs-on: ubuntu-latest
    name: cargo semver-checks
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Check default feature set, plus elgamal3 and legacy.
          # python/wasm bindings are not included here (and remain mutually exclusive).
          feature-group: default-features
          features: elgamal3,legacy,insecure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: ""
            name: "default"
          - features: "elgamal3"
            name: "default+elgamal3"
          - features: "legacy"
            name: "default+legacy"

    name: cargo test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features "${{ matrix.features }}"

  build-wasm:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [ "web", "nodejs" ]
        features:
          - "wasm"
          - "wasm,elgamal3"
          - "wasm,legacy"

    name: wasm-pack build (${{ matrix.target }}, ${{ matrix.features }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack
      - run: wasm-pack build --target ${{ matrix.target }} --features "${{ matrix.features }}"