name: Check versions

on:
  push:
    tags:
      - v*

env:
  # Workaround for intermittent `[16] Error in the HTTP2 framing layer` from
  # crates.io's CDN. Forces cargo's curl backend to use HTTP/1.1 instead of
  # HTTP/2 multiplexing when fetching the registry and crate sources.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  semver-checks:
    runs-on: ubuntu-latest
    name: cargo semver-checks
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Check default feature set, plus elgamal3 and legacy.
          # python/wasm bindings are not included here (and remain mutually exclusive).
          feature-group: default-features
          features: elgamal3,legacy,insecure

  check-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Check versions
        run: |
          # Get package.json version
          PKG_VERSION=$(node -p "require('./package.json').version")
          
          # Get Cargo.toml version
          CARGO_VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
          
          echo "package.json version: $PKG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          
          if [ "$PKG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch:"
            echo "package.json: $PKG_VERSION"
            echo "Cargo.toml: $CARGO_VERSION"
            exit 1
          fi
          
          echo "Versions match: $PKG_VERSION"
