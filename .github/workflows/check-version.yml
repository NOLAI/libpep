name: Check versions

on:
  push:
    tags:
      - v*

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Check versions
        run: |
          # Get package.json version
          PKG_VERSION=$(node -p "require('./bindings/wasm/package.json').version")
          
          # Get Cargo.toml version
          CARGO_VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name=="libpep") | .version')
          
          # The tag, without its v prefix
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "package.json version: $PKG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "tag version: $TAG_VERSION"

          if [ "$PKG_VERSION" != "$CARGO_VERSION" ] || [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch between package.json, Cargo.toml and the tag"
            exit 1
          fi

          echo "Versions match: $PKG_VERSION"
